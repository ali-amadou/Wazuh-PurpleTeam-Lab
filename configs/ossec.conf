<!-- 
  Wazuh Agent Configuration - Local Log Ingestion
  Location: C:\Program Files (x86)\ossec-agent\ossec.conf
-->

<ossec_config>

  <!-- Ingestion des événements de sécurité Windows (Event ID 4625 NTLM) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Ingestion de la télémétrie Sysmon (Event ID 1, 3, 10, etc.) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Ingestion des journaux de système Windows -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

</ossec_config>